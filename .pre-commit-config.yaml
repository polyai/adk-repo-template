# Formatters must match .github/scripts/format-project.sh, which defines the
# formatting a pull from Agent Studio gets. Any other formatter shows up as drift
# in the merge-time sync check.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^agents/
      - id: ruff-format
        files: ^agents/
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [yaml]
        files: ^agents/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        files: ^agents/
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uvx ty check
        language: system
        types: [python]
        files: ^agents/
        exclude: (^|/)(_gen/|imports\.py$)
