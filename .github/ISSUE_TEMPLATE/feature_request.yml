name: Feature Request
description: Suggest a new feature or improvement to the template
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the template? We'd love to hear it. For new `poly` commands, open an issue on the [ADK repo](https://github.com/polyai/adk/issues) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what workflow does it improve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about or workarounds you're using today.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the template does this relate to?
      options:
        - CI
        - Deploy (merge queue)
        - Sync Projects
        - Pre-commit hooks
        - Setup and documentation
        - Other
    validations:
      required: true
