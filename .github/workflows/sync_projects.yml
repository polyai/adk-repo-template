name: Sync Projects

on:
  schedule:
    # Run every day at 3 am UTC
    - cron: "0 3 * * *"
  repository_dispatch:
    types: [project-sync]
  workflow_dispatch:
    inputs:
      account_id:
        description: "Account to sync (blank or * for all)"
        required: false
        default: "*"
      project_id:
        description: "Project to sync (blank or * for all)"
        required: false
        default: "*"
      branch:
        description: "Branch to sync"
        required: false
        default: "main"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('project-sync-{0}', github.event.client_payload.project_id || github.run_id) || format('sync-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve sync request
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_sync: ${{ steps.resolve.outputs.should_sync }}
      from_deployment: ${{ steps.resolve.outputs.from_deployment }}
      branch: ${{ steps.resolve.outputs.branch }}
      account_id: ${{ steps.resolve.outputs.account_id }}
      project_id: ${{ steps.resolve.outputs.project_id }}
      artifact_version: ${{ steps.resolve.outputs.artifact_version }}
      deployment_type: ${{ steps.resolve.outputs.deployment_type }}
      client_env: ${{ steps.resolve.outputs.client_env }}
      deployment_message: ${{ steps.resolve.outputs.deployment_message }}
      version_hash: ${{ steps.resolve.outputs.version_hash }}
      user: ${{ steps.resolve.outputs.user }}
    steps:
      - name: Read workflow inputs or dispatch payload
        id: resolve
        env:
          # project-sync dispatches nest the Agent Studio deployment under client_payload.deployment
          # so new deployment fields can't push client_payload past GitHub's 10 top-level properties.
          ACCOUNT_ID: ${{ inputs.account_id || github.event.client_payload.account_id }}
          PROJECT_ID: ${{ inputs.project_id || github.event.client_payload.project_id }}
          BRANCH: ${{ inputs.branch || 'main' }}
          FROM_DEPLOYMENT: ${{ github.event.client_payload.deployment && 'true' || 'false' }}
          ARTIFACT_VERSION: ${{ github.event.client_payload.deployment.artifact_version }}
          DEPLOYMENT_TYPE: ${{ github.event.client_payload.deployment.deployment_type }}
          CLIENT_ENV: ${{ github.event.client_payload.deployment.client_env }}
          DEPLOYMENT_MESSAGE: ${{ github.event.client_payload.deployment.deployment_message }}
          VERSION_HASH: ${{ github.event.client_payload.deployment.version_hash }}
          USER_EMAIL: ${{ github.event.client_payload.deployment.user }}
        run: |
          set_output() {
            local delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }

          SHOULD_SYNC=true
          if [ "$FROM_DEPLOYMENT" = true ]; then
            # Promotions and pre-release deployments don't change what main holds.
            case "$DEPLOYMENT_TYPE" in publish|rollback) ;; *) SHOULD_SYNC=false ;; esac
            case "$CLIENT_ENV" in sandbox|live) ;; *) SHOULD_SYNC=false ;; esac
          fi

          if [ "$SHOULD_SYNC" = false ]; then
            echo "::notice::Skipping sync: only publish and rollback deployments to sandbox or live are synced"
            echo "deployment_type=${DEPLOYMENT_TYPE:-<none>} client_env=${CLIENT_ENV:-<none>}"
          fi

          set_output should_sync "$SHOULD_SYNC"
          set_output from_deployment "$FROM_DEPLOYMENT"
          set_output branch "$BRANCH"
          set_output account_id "$ACCOUNT_ID"
          set_output project_id "$PROJECT_ID"
          set_output artifact_version "$ARTIFACT_VERSION"
          set_output deployment_type "$DEPLOYMENT_TYPE"
          set_output client_env "$CLIENT_ENV"
          set_output deployment_message "$DEPLOYMENT_MESSAGE"
          set_output version_hash "$VERSION_HASH"
          set_output user "$USER_EMAIL"

  wait-for-merge-queue:
    name: Wait for merge queue
    needs: [resolve]
    if: needs.resolve.outputs.should_sync == 'true' && needs.resolve.outputs.from_deployment == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Wait if deployment matches merge queue PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_MESSAGE: ${{ needs.resolve.outputs.deployment_message }}
        run: |
          if [ -z "$DEPLOYMENT_MESSAGE" ]; then
            echo "No deployment message, proceeding with sync"
            exit 0
          fi

          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          DEPLOY_PR=$(echo "$DEPLOYMENT_MESSAGE" | sed -nE 's/.*[[:space:]]*\(#([0-9]+)\)$/\1/p')
          DEPLOY_TITLE=$(echo "$DEPLOYMENT_MESSAGE" | sed -E 's/[[:space:]]*\(#[0-9]+\)$//')

          check_merge_queue() {
            gh api graphql -f query='
              {
                repository(owner:"'"$REPO_OWNER"'", name:"'"$REPO_NAME"'") {
                  mergeQueue(branch:"main") {
                    entries(first: 1) {
                      nodes {
                        pullRequest {
                          number
                          title
                        }
                      }
                    }
                  }
                }
              }
            ' --jq '.data.repository.mergeQueue.entries.nodes[0].pullRequest? | select(.) | "\(.number)\t\(.title)"' || echo ""
          }

          matches_deployment() {
            local mq_entry="$1"
            [ -z "$mq_entry" ] && return 1
            [ -z "$DEPLOY_PR" ] && return 1

            local mq_number mq_title
            mq_number=$(echo "$mq_entry" | cut -f1)
            mq_title=$(echo "$mq_entry" | cut -f2)

            [ "$mq_number" != "$DEPLOY_PR" ] && return 1

            local stripped
            stripped=$(echo "$mq_title" | sed -E 's/^([a-z]+)\([^)]+\)!?:/\1:/')
            [ "$stripped" = "$DEPLOY_TITLE" ]
          }

          MQ_ENTRY=$(check_merge_queue)

          if ! matches_deployment "$MQ_ENTRY"; then
            echo "No merge queue conflict, proceeding with sync"
            exit 0
          fi

          echo "::notice::PR #$DEPLOY_PR is in the merge queue and matches deployment"
          echo "Polling until merge queue clears (max 5m)..."

          TIMEOUT=300
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            MQ_ENTRY=$(check_merge_queue)
            if ! matches_deployment "$MQ_ENTRY"; then
              echo "Merge queue cleared after ${ELAPSED}s, proceeding with sync"
              exit 0
            fi

            echo "PR #$DEPLOY_PR still in merge queue, waiting... (${ELAPSED}/${TIMEOUT}s)"
          done

          echo "::warning::Merge queue did not clear within ${TIMEOUT}s, proceeding with sync anyway"

  find-projects:
    needs: [resolve, wait-for-merge-queue]
    if: "!cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.should_sync == 'true'"
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      has_projects: ${{ steps.find.outputs.has_projects }}
      poly_adk_version_changed: ${{ steps.check-version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.branch }}

      - name: Check if Poly ADK version changed
        id: check-version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff HEAD~1 HEAD -- pyproject.toml | grep -q "polyai-adk"; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Poly ADK version changed — syncing all projects"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Find projects
        id: find
        env:
          INPUT_ACCOUNT_ID: ${{ needs.resolve.outputs.account_id }}
          INPUT_PROJECT_ID: ${{ needs.resolve.outputs.project_id }}
        run: |
          ACCOUNT_FILTER="$INPUT_ACCOUNT_ID"
          PROJECT_FILTER="$INPUT_PROJECT_ID"
          PROJECTS=()

          # Helper function to read YAML field
          read_yaml_field() {
            local file="$1"
            local field="$2"
            yq -r ".$field // \"\"" "$file" 2>/dev/null || \
              grep -E "^$field:" "$file" | awk '{print $2}' | tr -d '"' | tr -d "'" || echo ""
          }

          should_filter_account() { [ "$ACCOUNT_FILTER" != "*" ] && [ -n "$ACCOUNT_FILTER" ]; }
          should_filter_project() { [ "$PROJECT_FILTER" != "*" ] && [ -n "$PROJECT_FILTER" ]; }

          should_filter_account && echo "Filtering by account_id: $ACCOUNT_FILTER"
          should_filter_project && echo "Filtering by project_id: $PROJECT_FILTER"

          while IFS= read -r file; do
            dir=$(dirname "$file")
            # Extract account/project relative to agents/
            rel_path="${dir#agents/}"

            FILE_ACCOUNT_ID=$(read_yaml_field "$file" "account_id")
            FILE_PROJECT_ID=$(read_yaml_field "$file" "project_id")

            MATCH=true
            should_filter_account && [ "$FILE_ACCOUNT_ID" != "$ACCOUNT_FILTER" ] && MATCH=false
            should_filter_project && [ "$MATCH" = true ] && [ "$FILE_PROJECT_ID" != "$PROJECT_FILTER" ] && MATCH=false

            [ "$MATCH" = true ] && PROJECTS+=("$rel_path")
          done < <(find agents -name project.yaml -maxdepth 3)

          if [ ${#PROJECTS[@]} -eq 0 ]; then
            echo "::error::No projects found"
            echo "has_projects=false" >> $GITHUB_OUTPUT
            echo "projects=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          PROJECTS_JSON=$(printf '%s\n' "${PROJECTS[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$PROJECTS_JSON" >> $GITHUB_OUTPUT
          echo "has_projects=true" >> $GITHUB_OUTPUT
          echo "Found projects: $PROJECTS_JSON"

  sync-projects:
    name: Sync ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [resolve, find-projects]
    if: |
      !cancelled() && needs.find-projects.result == 'success' &&
      needs.find-projects.outputs.has_projects == 'true' &&
      (github.event_name != 'push' || needs.find-projects.outputs.poly_adk_version_changed == 'true')
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.find-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.POLY_CONFIG_BOT_TOKEN }}
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Install prettier
        run: npm install -g prettier@3.1.0

      - name: Configure git
        run: |
          git config user.name "Poly Config Bot"
          git config user.email "poly-config-bot@poly-ai.com"

      - name: Pull from Agent Studio
        env:
          POLY_ADK_KEY: ${{ secrets.POLY_ADK_KEY }}
          POLY_ADK_KEY_US: ${{ secrets.POLY_ADK_KEY_US }}
          POLY_ADK_KEY_UK: ${{ secrets.POLY_ADK_KEY_UK }}
          POLY_ADK_KEY_EUW: ${{ secrets.POLY_ADK_KEY_EUW }}
          POLY_ADK_KEY_DEV: ${{ secrets.POLY_ADK_KEY_DEV }}
          POLY_ADK_KEY_STAGING: ${{ secrets.POLY_ADK_KEY_STAGING }}
          POLY_ADK_KEY_STUDIO: ${{ secrets.POLY_ADK_KEY_STUDIO }}
          # A Poly ADK version bump regenerates _gen/, which the skip-if-unchanged
          # check has nothing to compare against — always pull there.
          FORCE_PULL: ${{ github.event_name == 'push' && needs.find-projects.outputs.poly_adk_version_changed == 'true' }}
        run: |
          source .venv/bin/activate
          PROJECT_PATH="agents/${{ matrix.project }}"
          echo "Pulling $PROJECT_PATH from Agent Studio..."

          PULL_ARGS=""
          if [ "$FORCE_PULL" = "true" ]; then
            PULL_ARGS="--force"
          fi

          set +e
          python .github/scripts/poly_adk_scripts/pull_project.py "$PROJECT_PATH" $PULL_ARGS
          PULL_EXIT_CODE=$?
          set -e

          # Exit 2 means Agent Studio main already matches disk — not a failure.
          if [ $PULL_EXIT_CODE -eq 1 ]; then
            exit 1
          fi

      - name: Format and commit
        env:
          TARGET_BRANCH: ${{ needs.resolve.outputs.branch }}
          INPUT_DEPLOYMENT_MESSAGE: ${{ needs.resolve.outputs.deployment_message }}
          INPUT_VERSION_HASH: ${{ needs.resolve.outputs.version_hash }}
          INPUT_USER_EMAIL: ${{ needs.resolve.outputs.user }}
          INPUT_FROM_DEPLOYMENT: ${{ needs.resolve.outputs.from_deployment }}
          INPUT_ARTIFACT_VERSION: ${{ needs.resolve.outputs.artifact_version }}
          INPUT_DEPLOYMENT_TYPE: ${{ needs.resolve.outputs.deployment_type }}
          INPUT_CLIENT_ENV: ${{ needs.resolve.outputs.client_env }}
        run: |
          source .venv/bin/activate
          PROJECT_PATH="agents/${{ matrix.project }}"
          PROJECT_NAME="${{ matrix.project }}"

          if [ -z "$(git status --porcelain "$PROJECT_PATH")" ]; then
            echo "No changes detected for $PROJECT_NAME"
            exit 0
          fi

          echo "Changes detected, formatting and committing..."

          # The repo's formatting pass — shared with the AS parent sync check in
          # deploy.yml, which treats "a sync would commit nothing" as in sync.
          ./.github/scripts/format-project.sh "$PROJECT_PATH"
          git add "$PROJECT_PATH"

          echo "=== Changes ==="
          git diff --cached --name-status -- "$PROJECT_PATH"
          echo ""

          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes after formatting"
            exit 0
          fi

          # Build commit message
          if [ -n "$INPUT_DEPLOYMENT_MESSAGE" ]; then
            SUBJECT_BODY="$INPUT_DEPLOYMENT_MESSAGE"
          else
            SUBJECT_BODY="Sync with Agent Studio"
          fi

          # Rollback syncs are labeled revert() so they stand out from
          # ordinary publish syncs in git log
          if [ "$INPUT_DEPLOYMENT_TYPE" = "rollback" ]; then
            COMMIT_TYPE="revert"
          else
            COMMIT_TYPE="chore"
          fi
          COMMIT_MSG="$COMMIT_TYPE($PROJECT_NAME): $SUBJECT_BODY"
          if [ "$INPUT_FROM_DEPLOYMENT" = true ]; then
            DETAILS=""
            [ -n "$INPUT_ARTIFACT_VERSION" ] && DETAILS=$(printf '%s\nArtifact version: %s' "$DETAILS" "$INPUT_ARTIFACT_VERSION")
            [ -n "$INPUT_DEPLOYMENT_TYPE" ] && DETAILS=$(printf '%s\nDeployment type: %s' "$DETAILS" "$INPUT_DEPLOYMENT_TYPE")
            [ -n "$INPUT_CLIENT_ENV" ] && DETAILS=$(printf '%s\nEnvironment: %s' "$DETAILS" "$INPUT_CLIENT_ENV")
            [ -n "$INPUT_USER_EMAIL" ] && DETAILS=$(printf '%s\nUser: %s' "$DETAILS" "$INPUT_USER_EMAIL")
            [ -n "$INPUT_VERSION_HASH" ] && DETAILS=$(printf '%s\nVersion hash: %s' "$DETAILS" "$INPUT_VERSION_HASH")
            [ -n "$DETAILS" ] && COMMIT_MSG=$(printf '%s\n%s' "$COMMIT_MSG" "$DETAILS")
          fi

          git commit -m "$COMMIT_MSG"

          # Push with retries (handles parallel project pushes)
          for attempt in $(seq 1 5); do
            echo "Pushing (attempt $attempt/5)..."
            git fetch origin "$TARGET_BRANCH" 2>&1 || true
            if ! git rebase "origin/$TARGET_BRANCH" 2>&1; then
              echo "::warning::Rebase failed"
              git rebase --abort 2>&1 || true
              exit 1
            fi
            if git push --force-with-lease origin "HEAD:$TARGET_BRANCH" 2>&1; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push failed, retrying..."
            sleep 1
          done

          echo "::error::Failed to push after 5 attempts"
          exit 1
