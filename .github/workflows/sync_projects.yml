name: Sync Projects

on:
  schedule:
    # Run every day at 3 am UTC
    - cron: "0 3 * * *"
  repository_dispatch:
    # The sandbox types are for projects still on legacy deployments, where merges to main publish to sandbox.
    types: [project-publish-live, project-publish-sandbox, project-rollback-live, project-rollback-sandbox]
  workflow_dispatch:
    inputs:
      account_id:
        description: "Account to sync (blank or * for all)"
        required: false
        default: "*"
      project_id:
        description: "Project to sync (blank or * for all)"
        required: false
        default: "*"
      branch:
        description: "Branch to sync"
        required: false
        default: "main"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# A newer dispatch for a project cancels the older run: it pulls the latest Dialog Studio state anyway.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('project-sync-{0}', github.event.client_payload.project_id || github.run_id) || format('sync-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve sync request
    # The template has no projects, so its nightly sync has nothing to do. Repos created from it run as normal.
    if: github.event_name != 'schedule' || github.repository != 'polyai/adk-repo-template'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      from_deployment: ${{ steps.resolve.outputs.from_deployment }}
      account_id: ${{ steps.resolve.outputs.account_id }}
      project_id: ${{ steps.resolve.outputs.project_id }}
      artifact_version: ${{ steps.resolve.outputs.artifact_version }}
      deployment_type: ${{ steps.resolve.outputs.deployment_type }}
      client_env: ${{ steps.resolve.outputs.client_env }}
      deployment_message: ${{ steps.resolve.outputs.deployment_message }}
      version_hash: ${{ steps.resolve.outputs.version_hash }}
      user: ${{ steps.resolve.outputs.user }}
    steps:
      - name: Read workflow inputs or dispatch payload
        id: resolve
        env:
          # Dispatches nest the Dialog Studio deployment under client_payload.deployment
          # so new deployment fields can't push client_payload past GitHub's 10 top-level properties.
          EVENT_NAME: ${{ github.event_name }}
          ACCOUNT_ID: ${{ inputs.account_id || github.event.client_payload.account_id }}
          PROJECT_ID: ${{ inputs.project_id || github.event.client_payload.project_id }}
          FROM_DEPLOYMENT: ${{ github.event.client_payload.deployment && 'true' || 'false' }}
          ARTIFACT_VERSION: ${{ github.event.client_payload.deployment.artifact_version }}
          DEPLOYMENT_TYPE: ${{ github.event.client_payload.deployment.deployment_type || (startsWith(github.event.action, 'project-rollback-') && 'rollback') || (startsWith(github.event.action, 'project-publish-') && 'publish') || '' }}
          CLIENT_ENV: ${{ github.event.client_payload.deployment.client_env }}
          DEPLOYMENT_MESSAGE: ${{ github.event.client_payload.deployment.deployment_message }}
          VERSION_HASH: ${{ github.event.client_payload.deployment.version_hash }}
          USER_EMAIL: ${{ github.event.client_payload.deployment.user }}
        run: |
          set_output() {
            local delim
            delim="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$delim"; printf '%s\n' "$2"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          }

          # find-projects reads an empty or "*" ID as "every project", which only manual runs may ask for.
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            for id in "$ACCOUNT_ID" "$PROJECT_ID"; do
              if [ -z "$id" ] || [ "$id" = "*" ]; then
                echo "::error::Dispatches must set client_payload.account_id and client_payload.project_id to a single project"
                exit 1
              fi
            done
          fi

          set_output from_deployment "$FROM_DEPLOYMENT"
          set_output account_id "$ACCOUNT_ID"
          set_output project_id "$PROJECT_ID"
          set_output artifact_version "$ARTIFACT_VERSION"
          set_output deployment_type "$DEPLOYMENT_TYPE"
          set_output client_env "$CLIENT_ENV"
          set_output deployment_message "$DEPLOYMENT_MESSAGE"
          set_output version_hash "$VERSION_HASH"
          set_output user "$USER_EMAIL"

  wait-for-merge-queue:
    name: Wait for merge queue or /poly-merge
    needs: [resolve]
    if: needs.resolve.outputs.from_deployment == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Waits while the PR named in the deployment message is still merging: in the merge
      # queue, or in a /poly-merge run when DEPLOY_MODE=command.
      - name: Wait if deployment matches a PR still merging
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_MESSAGE: ${{ needs.resolve.outputs.deployment_message }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
        run: |
          if [ -z "$DEPLOYMENT_MESSAGE" ]; then
            echo "No deployment message, proceeding with sync"
            exit 0
          fi

          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          DEPLOY_PR=$(echo "$DEPLOYMENT_MESSAGE" | sed -nE 's/.*[[:space:]]*\(#([0-9]+)\)$/\1/p')
          DEPLOY_TITLE=$(echo "$DEPLOYMENT_MESSAGE" | sed -E 's/[[:space:]]*\(#[0-9]+\)$//')

          check_merge_queue() {
            gh api graphql -f query='
              {
                repository(owner:"'"$REPO_OWNER"'", name:"'"$REPO_NAME"'") {
                  mergeQueue(branch:"main") {
                    entries(first: 1) {
                      nodes {
                        pullRequest {
                          number
                          title
                        }
                      }
                    }
                  }
                }
              }
            ' --jq '.data.repository.mergeQueue.entries.nodes[0].pullRequest? | select(.) | "\(.number)\t\(.title)"' || echo ""
          }

          matches_deployment() {
            local mq_entry="$1"
            [ -z "$mq_entry" ] && return 1
            [ -z "$DEPLOY_PR" ] && return 1

            local mq_number mq_title
            mq_number=$(echo "$mq_entry" | cut -f1)
            mq_title=$(echo "$mq_entry" | cut -f2)

            [ "$mq_number" != "$DEPLOY_PR" ] && return 1

            local stripped
            stripped=$(echo "$mq_title" | sed -E 's/^([a-z]+)\([^)]+\)!?:/\1:/')
            [ "$stripped" = "$DEPLOY_TITLE" ]
          }

          still_merging() {
            if [ "$DEPLOY_MODE" = command ]; then
              [ -n "$DEPLOY_PR" ] && for status in requested queued pending waiting in_progress; do
                gh run list -R "$GITHUB_REPOSITORY" -w merge-command.yml -s "$status" -L 100 \
                  --json displayTitle --jq '.[].displayTitle'
              done | grep -qx "/poly-merge #$DEPLOY_PR"
            else
              matches_deployment "$(check_merge_queue)"
            fi
          }

          if ! still_merging; then
            echo "No merge in progress for this deployment, proceeding with sync"
            exit 0
          fi

          echo "::notice::PR #$DEPLOY_PR is still merging and matches deployment"
          echo "Polling until it finishes (max 15m)..."

          TIMEOUT=900
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            if ! still_merging; then
              echo "PR #$DEPLOY_PR finished merging after ${ELAPSED}s, proceeding with sync"
              exit 0
            fi

            echo "PR #$DEPLOY_PR still merging, waiting... (${ELAPSED}/${TIMEOUT}s)"
          done

          echo "::warning::PR #$DEPLOY_PR did not finish merging within ${TIMEOUT}s, proceeding with sync anyway"

  find-projects:
    needs: [resolve, wait-for-merge-queue]
    if: "!cancelled() && needs.resolve.result == 'success'"
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      has_projects: ${{ steps.find.outputs.has_projects }}
      shards: ${{ steps.find.outputs.shards }}
      poly_adk_version_changed: ${{ steps.check-version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 is enough for the HEAD~1 diff below.
          fetch-depth: 2
          ref: ${{ inputs.branch || 'main' }}

      - name: Check if Poly ADK version changed
        id: check-version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff HEAD~1 HEAD -- pyproject.toml | grep -q "polyai-adk"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Poly ADK version changed — syncing all projects"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find projects
        id: find
        env:
          INPUT_ACCOUNT_ID: ${{ needs.resolve.outputs.account_id }}
          INPUT_PROJECT_ID: ${{ needs.resolve.outputs.project_id }}
          # A runner per this many projects, up to the max: the sync is CPU-bound,
          # so more runners is what makes a large sync faster.
          SYNC_PROJECTS_PER_SHARD: 40
          SYNC_MAX_SHARDS: 16
        run: |
          # PyYAML ships in the runner image; install it if that ever changes.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 .github/scripts/find_projects.py

  sync-projects:
    name: Sync projects (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [resolve, find-projects]
    timeout-minutes: 60
    if: |
      !cancelled() && needs.find-projects.result == 'success' &&
      needs.find-projects.outputs.has_projects == 'true' &&
      (github.event_name != 'push' || needs.find-projects.outputs.poly_adk_version_changed == 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.find-projects.outputs.shards) }}
    env:
      PROJECTS_JSON: ${{ needs.find-projects.outputs.projects }}
    steps:
      # Just the tip: nothing the sync does reads older history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'main' }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Install prettier
        run: npm install -g prettier@3.1.0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Sync projects
        env:
          POLY_ADK_KEY: ${{ secrets.POLY_ADK_KEY }}
          POLY_ADK_KEY_US: ${{ secrets.POLY_ADK_KEY_US }}
          POLY_ADK_KEY_UK: ${{ secrets.POLY_ADK_KEY_UK }}
          POLY_ADK_KEY_EUW: ${{ secrets.POLY_ADK_KEY_EUW }}
          POLY_ADK_KEY_STUDIO: ${{ secrets.POLY_ADK_KEY_STUDIO }}
          # A Poly ADK version bump regenerates _gen/, which the skip-if-unchanged
          # check has nothing to compare against — always pull there.
          FORCE_PULL: ${{ github.event_name == 'push' && needs.find-projects.outputs.poly_adk_version_changed == 'true' }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.branch || 'main' }}
          INPUT_DEPLOYMENT_MESSAGE: ${{ needs.resolve.outputs.deployment_message }}
          INPUT_VERSION_HASH: ${{ needs.resolve.outputs.version_hash }}
          INPUT_USER_EMAIL: ${{ needs.resolve.outputs.user }}
          INPUT_FROM_DEPLOYMENT: ${{ needs.resolve.outputs.from_deployment }}
          INPUT_ARTIFACT_VERSION: ${{ needs.resolve.outputs.artifact_version }}
          INPUT_DEPLOYMENT_TYPE: ${{ needs.resolve.outputs.deployment_type }}
          INPUT_CLIENT_ENV: ${{ needs.resolve.outputs.client_env }}
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          source .venv/bin/activate

          # The push credential lives in an unexported variable that only the git
          # fetches and pushes below use, so the ADK and the formatters never see it.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          unset PUSH_TOKEN
          with_auth() { git -c "http.https://github.com/.extraheader=$AUTH" "$@"; }

          # Every SHARDS-th project, so each shard gets an even share, in random
          # order: projects that sort together and all changed then spread their
          # commits over the run instead of every shard pushing at once.
          PROJECTS=$(echo "$PROJECTS_JSON" | jq -r --argjson shard "$SHARD" --argjson shards "$SHARDS" \
            'to_entries[] | select(.key % $shards == $shard) | .value' | shuf)

          # One line per project, for the summary job.
          RESULTS="$RUNNER_TEMP/sync-results/shard-$SHARD.jsonl"
          mkdir -p "$(dirname "$RESULTS")"
          record() {
            jq -nc --arg project "$1" --arg status "$2" --arg message "${3:-}" \
              '{project: $project, status: $status, message: $message}' >> "$RESULTS"
          }

          # The tree $1 with the directory at path $2 replaced by the tree $3,
          # rewriting only the trees along the path.
          swap_dir() {
            local tree=$1 path=$2 new=$3 name=${2%%/*} old="" child
            if [ "$name" = "$path" ]; then
              child=$new
            else
              [ -n "$tree" ] && old=$(git rev-parse -q --verify "$tree:$name" || true)
              child=$(swap_dir "$old" "${path#*/}" "$new")
            fi
            { if [ -n "$tree" ]; then git ls-tree "$tree" | awk -F'\t' -v n="$name" '$2 != n'; fi
              printf '040000 tree %s\t%s\n' "$child" "$name"; } | git mktree
          }

          # Commit $3 remade on top of $1: its folder $2 swapped into $1's tree,
          # without touching the working tree.
          commit_on() {
            local root
            root=$(swap_dir "$(git rev-parse "$1^{tree}")" "$2" "$(git rev-parse "$3:$2")")
            git log -1 --format=%B "$3" | git commit-tree "$root" -p "$1"
          }

          # Commits not pushed yet: the project's folder, its local commit, and the
          # commit its pull started from. The other shards push to the same branch,
          # so a push can be refused; the commits then wait here and go with the
          # next push, which carries all of them at once.
          QUEUED_PATHS=()
          QUEUED_COMMITS=()
          QUEUED_BASES=()
          FAILED=0

          # One push of every queued commit, each remade in order on the branch's
          # current tip, so a collision can only happen between this fetch and the
          # push. A commit whose project changed on the branch after its pull's base
          # (another sync, a merge) is dropped: the branch's version is newer than
          # that pull. Returns 1 if the push was refused.
          push_queued() {
            local tip parent i path kept=() pushed=() entry
            if with_auth fetch -q origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" 2>/dev/null; then
              tip=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
            else
              tip=$(git rev-parse HEAD) # a branch the sync is creating
            fi
            parent=$tip
            for i in "${!QUEUED_COMMITS[@]}"; do
              path=${QUEUED_PATHS[$i]}
              if [ "$(git rev-parse -q --verify "$tip:$path" || true)" != "$(git rev-parse "${QUEUED_BASES[$i]}:$path")" ]; then
                echo "::notice title=Left for the next sync — ${path#agents/}::$TARGET_BRANCH changed this project during its sync"
                record "${path#agents/}" superseded "$TARGET_BRANCH changed this project during its sync"
                continue
              fi
              parent=$(commit_on "$parent" "$path" "${QUEUED_COMMITS[$i]}")
              kept+=("$i")
              pushed+=("${path#agents/}=$parent")
            done
            local paths=() commits=() bases=()
            for i in "${kept[@]}"; do
              paths+=("${QUEUED_PATHS[$i]}")
              commits+=("${QUEUED_COMMITS[$i]}")
              bases+=("${QUEUED_BASES[$i]}")
            done
            QUEUED_PATHS=("${paths[@]}")
            QUEUED_COMMITS=("${commits[@]}")
            QUEUED_BASES=("${bases[@]}")
            [ ${#QUEUED_COMMITS[@]} -eq 0 ] && return 0

            if ! with_auth push -q origin "$parent:refs/heads/$TARGET_BRANCH" 2>&1; then
              echo "Push refused; ${#QUEUED_COMMITS[@]} commit(s) stay queued"
              return 1
            fi
            for entry in "${pushed[@]}"; do
              echo "✓ Pushed commit for ${entry%%=*}"
              record "${entry%%=*}" committed "${entry#*=}"
            done
            QUEUED_PATHS=()
            QUEUED_COMMITS=()
            QUEUED_BASES=()
            # The next project's refresh brings the files up to date.
            git reset -q --soft "$parent"
          }

          TOTAL=$(echo "$PROJECTS" | grep -c .)
          INDEX=0
          while IFS= read -r PROJECT; do
            INDEX=$((INDEX + 1))
            PROJECT_PATH="agents/${PROJECT}"
            echo "::group::[$INDEX/$TOTAL] Sync $PROJECT"

            # Start from the branch's current tip. Queued commits are kept as
            # objects, never on HEAD, so this drops nothing but leftovers.
            if with_auth fetch -q origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" 2>/dev/null; then
              git reset -q --hard "refs/remotes/origin/$TARGET_BRANCH"
            else
              git reset -q --hard HEAD
            fi
            git clean -fdq

            # Dialog Studio 5xx errors are usually transient, so those are retried.
            PULL_ARGS=()
            [ "$FORCE_PULL" = "true" ] && PULL_ARGS+=(--force)
            PULL_LOG="$RUNNER_TEMP/pull.log"
            for attempt in 1 2 3; do
              set +e
              python .github/scripts/poly_adk_scripts/pull_project.py "$PROJECT_PATH" "${PULL_ARGS[@]}" 2>&1 | tee "$PULL_LOG"
              PULL_EXIT_CODE=${PIPESTATUS[0]}
              set -e
              if [ "$PULL_EXIT_CODE" -ne 1 ] || [ "$attempt" -eq 3 ] || ! grep -qE 'API Error 50[0234]' "$PULL_LOG"; then
                break
              fi
              echo "Transient Dialog Studio error, retrying (attempt $attempt/3)..."
              sleep $((attempt * 2))
            done

            # Exit 2 means Dialog Studio main already matches disk — not a failure.
            if [ "$PULL_EXIT_CODE" -eq 1 ]; then
              REASON=$(grep -m1 '^Pull failed:' "$PULL_LOG" || echo "Pull failed")
              echo "::error title=Sync failed — $PROJECT::${REASON//%/%25}"
              record "$PROJECT" failed "$REASON"
              FAILED=$((FAILED + 1))
              echo "::endgroup::"
              continue
            fi

            if [ -n "$(git status --porcelain "$PROJECT_PATH")" ]; then
              # The repo's formatting pass — shared with the DS parent sync check in
              # deploy.yml, which treats "a sync would commit nothing" as in sync.
              ./.github/scripts/format-project.sh "$PROJECT_PATH"
              git add "$PROJECT_PATH"
            fi
            if [ -z "$(git diff --cached --name-only)" ]; then
              echo "No changes detected for $PROJECT"
              record "$PROJECT" no_change
              echo "::endgroup::"
              continue
            fi
            echo "Files changed for $PROJECT:"
            git diff --cached --stat=120 -- "$PROJECT_PATH"

            # Build commit message
            if [ -n "$INPUT_DEPLOYMENT_MESSAGE" ]; then
              SUBJECT_BODY="$INPUT_DEPLOYMENT_MESSAGE"
            else
              SUBJECT_BODY="Sync with Dialog Studio"
            fi

            # Rollback syncs are labeled revert() so they stand out from
            # ordinary publish syncs in git log
            if [ "$INPUT_DEPLOYMENT_TYPE" = "rollback" ]; then
              COMMIT_TYPE="revert"
            else
              COMMIT_TYPE="chore"
            fi
            COMMIT_MSG="$COMMIT_TYPE($PROJECT): $SUBJECT_BODY"
            if [ "$INPUT_FROM_DEPLOYMENT" = true ]; then
              DETAILS=""
              [ -n "$INPUT_ARTIFACT_VERSION" ] && DETAILS=$(printf '%s\nArtifact version: %s' "$DETAILS" "$INPUT_ARTIFACT_VERSION")
              [ -n "$INPUT_DEPLOYMENT_TYPE" ] && DETAILS=$(printf '%s\nDeployment type: %s' "$DETAILS" "$INPUT_DEPLOYMENT_TYPE")
              [ -n "$INPUT_CLIENT_ENV" ] && DETAILS=$(printf '%s\nEnvironment: %s' "$DETAILS" "$INPUT_CLIENT_ENV")
              [ -n "$INPUT_USER_EMAIL" ] && DETAILS=$(printf '%s\nUser: %s' "$DETAILS" "$INPUT_USER_EMAIL")
              [ -n "$INPUT_VERSION_HASH" ] && DETAILS=$(printf '%s\nVersion hash: %s' "$DETAILS" "$INPUT_VERSION_HASH")
              [ -n "$DETAILS" ] && COMMIT_MSG=$(printf '%s\n%s' "$COMMIT_MSG" "$DETAILS")
            fi
            git commit -q -m "$COMMIT_MSG"

            # Queued and pushed straight away. HEAD goes back to the commit's
            # base, so the next project's refresh never replays it.
            QUEUED_PATHS+=("$PROJECT_PATH")
            QUEUED_COMMITS+=("$(git rev-parse HEAD)")
            QUEUED_BASES+=("$(git rev-parse HEAD~1)")
            git reset -q --soft HEAD~1
            push_queued || true
            echo "::endgroup::"
          done < <(echo "$PROJECTS")

          # Commits still queued were refused while other shards pushed. Keep
          # trying, with a random backoff growing to 8s, for up to 15 minutes.
          attempt=0
          deadline=$((SECONDS + 900))
          until [ ${#QUEUED_COMMITS[@]} -eq 0 ] || push_queued; do
            if [ $SECONDS -ge $deadline ]; then
              for path in "${QUEUED_PATHS[@]}"; do
                echo "::error title=Push failed — ${path#agents/}::Its commit could not be pushed for 15 minutes"
                record "${path#agents/}" failed "its commit could not be pushed for 15 minutes"
                FAILED=$((FAILED + 1))
              done
              break
            fi
            attempt=$((attempt + 1))
            WAIT_MS=$((RANDOM % (1000 << (attempt < 4 ? attempt - 1 : 3))))
            echo "Retrying ${#QUEUED_COMMITS[@]} queued commit(s) in ${WAIT_MS}ms..."
            sleep "$((WAIT_MS / 1000)).$(printf '%03d' $((WAIT_MS % 1000)))"
          done

          [ "$FAILED" -eq 0 ]

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/sync-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Summary
    needs: [find-projects, sync-projects]
    if: always() && needs.find-projects.result == 'success' && needs.sync-projects.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'main' }}
          sparse-checkout: .github/scripts/sync_summary.py
          sparse-checkout-cone-mode: false

      - name: Download results
        uses: actions/download-artifact@v7
        # A run whose shards all died before uploading has nothing to download;
        # the summary then reports every project as missing.
        continue-on-error: true
        with:
          pattern: sync-results-*
          path: results
          merge-multiple: true

      - name: Summarize
        env:
          PROJECTS_JSON: ${{ needs.find-projects.outputs.projects }}
        run: python3 .github/scripts/sync_summary.py results
